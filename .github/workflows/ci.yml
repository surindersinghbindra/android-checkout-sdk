name: Android SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v3
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Publish SDK locally for App testing
      run: ./gradlew publishToMavenLocal -Pversion=1.0.6-SNAPSHOT

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Run Binary Compatibility Validator API Check
      run: ./gradlew apiCheck
      
    # - name: Build Debug App
    #   run: ./gradlew assembleDebug
